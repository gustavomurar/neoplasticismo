<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="icone.png">
<title>NeoPlasticismo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="site" aria-label="Site sobre Neoplasticismo">
  <section class="page" data-page="1">
    <img src="assets/page1.png" alt="Página inicial do site Neo Plasticismo" draggable="false">
    <div class="hotspot nav home" data-go="1" aria-label="Início"></div>
    <div class="hotspot nav works" data-go="2" aria-label="Obras"></div>
    <div class="hotspot nav movement" data-go="3" aria-label="Movimento"></div>
    <div class="hotspot nav create" data-create aria-label="Crie sua obra"></div>
    <div class="hotspot footer-home" data-go="1"></div>
    <div class="hotspot footer-works" data-go="2"></div>
    <div class="hotspot footer-movement" data-go="3"></div>
  </section>

  <section class="page" data-page="2" hidden>
    <img src="assets/page2.png" alt="Página de obras do site Neo Plasticismo" draggable="false">
    <div class="hotspot nav home" data-go="1" aria-label="Início"></div>
    <div class="hotspot nav works" data-go="2" aria-label="Obras"></div>
    <div class="hotspot nav movement" data-go="3" aria-label="Movimento"></div>
    <div class="hotspot nav create" data-create aria-label="Crie sua obra"></div>
    <a class="hotspot artwork a1" href="https://www.kunstmuseum.nl/en/collection/composition-red-blue-black-yellow-and-gray" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Piet Mondrian"></a>
    <a class="hotspot artwork a2" href="https://www.guggenheim.org/artwork/1078" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Theo van Doesburg"></a>
    <a class="hotspot artwork a3" href="https://www.moma.org/collection/works/4044" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Gerrit Rietveld"></a>
    <a class="hotspot artwork a4" href="https://www.metmuseum.org/art/collection/search/481484" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Ilya Bolotowsky"></a>
    <a class="hotspot artwork a5" href="https://www.museedegrenoble.fr/oeuvre/2293/1922-composition-n-3.htm" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Jean Gorin"></a>
    <a class="hotspot artwork a6" href="https://whitney.org/collection/works/51" target="_blank" rel="noopener" aria-label="Fonte oficial da obra de Burgoyne Diller"></a>
    <div class="hotspot footer-home" data-go="1"></div>
    <div class="hotspot footer-works" data-go="2"></div>
    <div class="hotspot footer-movement" data-go="3"></div>
  </section>

  <section class="page" data-page="3" hidden>
    <img src="assets/page3.png" alt="Página do movimento Neoplasticismo" draggable="false">
    <div class="hotspot nav home" data-go="1" aria-label="Início"></div>
    <div class="hotspot nav works" data-go="2" aria-label="Obras"></div>
    <div class="hotspot nav movement" data-go="3" aria-label="Movimento"></div>
    <div class="hotspot nav create" data-create aria-label="Crie sua obra"></div>
    <div class="hotspot footer-home" data-go="1"></div>
    <div class="hotspot footer-works" data-go="2"></div>
    <div class="hotspot footer-movement" data-go="3"></div>
  </section>
</main>


<script src="script.js"></script>
</body>
</html>
